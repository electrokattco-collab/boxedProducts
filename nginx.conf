# ============================================================================
# Nginx Configuration for Boxed Sneakers - Coolify Deployment
# Optimized for static site delivery with SPA routing support
# ============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # =========================================================================
    # Gzip Compression
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        font/woff2
        image/svg+xml;

    # =========================================================================
    # Security Headers
    # =========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # =========================================================================
    # Static Asset Caching
    # =========================================================================
    # Cache images, fonts, and icons for 1 year (immutable)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # Cache CSS and JS for 1 week (can be changed when updated)
    location ~* \.(css|js)$ {
        expires 1w;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # =========================================================================
    # API Proxy (for future backend integration)
    # Uncomment if adding a backend API
    # =========================================================================
    # location /api/ {
    #     proxy_pass http://backend:3000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # =========================================================================
    # Health Check Endpoint for Coolify
    # =========================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # Main Application - SPA Routing
    # =========================================================================
    location / {
        # Try to serve file, then directory, then fall back to index.html
        try_files $uri $uri/ /index.html;

        # Add cache control for HTML files (short cache)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # =========================================================================
    # Specific page routing (for multi-page site)
    # These routes serve specific HTML files directly
    # =========================================================================
    location = /admin {
        try_files /admin.html =404;
    }

    location = /cart {
        try_files /boxedCart.html =404;
    }

    location = /about {
        try_files /boxedAboutUs.html =404;
    }

    location = /contact {
        try_files /boxedContacts.html =404;
    }

    # =========================================================================
    # Error Pages
    # =========================================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # =========================================================================
    # Block access to hidden files
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # Block access to sensitive files
    # =========================================================================
    location ~* \.(env|git|gitignore|gitattributes|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
