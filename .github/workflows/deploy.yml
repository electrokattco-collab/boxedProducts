name: Deploy to Coolify

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
      
    - name: Run tests
      run: npm test
      
    - name: Run build
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 1

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to Coolify Staging
      run: |
        curl -X POST "${{ secrets.COOLIFY_STAGING_WEBHOOK }}" \
          -H "Content-Type: application/json" \
          -d '{"ref":"main"}' || true

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    environment:
      name: production
      url: https://boxedsneakers.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to Coolify Production
      run: |
        curl -X POST "${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}" \
          -H "Content-Type: application/json" \
          -d '{"ref":"production"}' || true
          
    - name: Notify deployment
      if: always()
      run: |
        echo "Deployment status: ${{ job.status }}"
