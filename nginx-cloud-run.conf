# nginx-cloud-run.conf
# Nginx configuration optimized for Google Cloud Run
# Serves static files on port 8080

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # =========================================================================
    # Gzip Compression
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        font/woff2
        image/svg+xml;

    # =========================================================================
    # Security Headers
    # =========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # =========================================================================
    # Cache Static Assets
    # =========================================================================
    # Cache images, fonts, icons for 1 year (immutable)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # Cache CSS and JS for 1 week
    location ~* \.(css|js)$ {
        expires 1w;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # =========================================================================
    # Health Check Endpoint for Cloud Run
    # =========================================================================
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # Main Application - SPA Routing
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # =========================================================================
    # Block Access to Hidden Files
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # Block Access to Sensitive Files
    # =========================================================================
    location ~* \.(env|git|gitignore|gitattributes|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
